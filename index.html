<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DB Meir Sales Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; max-width: 1200px; margin: 0 auto; padding-bottom: 30px; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 16px; }
        h1 { font-size: 1.2rem; color: var(--accent-blue); font-weight: 700; }
        
        .btn { background: #334155; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .btn-primary { background: #2563eb; color: white; width: 100%; padding: 12px; font-size: 1rem; margin-top: 10px; }
        .btn-danger { background: #dc2626; }

        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media(min-width: 768px) { .grid-layout { grid-template-columns: 360px 1fr; } }

        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border-color); margin-bottom: 16px; }
        .card h2 { font-size: 1rem; margin-bottom: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 4px; }
        select, input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 8px; font-size: 0.95rem; outline: none; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 10px 0; background: #0f172a; padding: 10px; border-radius: 8px; }
        .checkbox-group input { width: auto; }
        .hidden { display: none !important; }

        /* KPI Cards */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 16px; }
        .kpi-box { background: #0f172a; padding: 12px; border-radius: 10px; text-align: center; border: 2px solid var(--border-color); transition: all 0.3s; }
        .kpi-box.status-red { border-color: var(--accent-red); }
        .kpi-box.status-yellow { border-color: var(--accent-yellow); }
        .kpi-box.status-green { border-color: var(--accent-green); box-shadow: 0 0 10px rgba(34, 197, 94, 0.25); }
        .kpi-title { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; }
        .kpi-value { font-size: 1.15rem; font-weight: bold; }
        .kpi-target { font-size: 0.7rem; color: #64748b; margin-top: 2px; }

        /* Team Table */
        .team-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .team-table th, .team-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border-color); }
        .team-table th { color: #94a3b8; font-weight: 600; background: #0f172a; }
        .team-table td:first-child { text-align: left; font-weight: bold; }
        .badge-regime { font-size: 0.65rem; padding: 2px 5px; background: #334155; border-radius: 4px; margin-left: 4px; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header>
        <h1>DB Meir Dashboard</h1>
        <button class="btn" type="button" onclick="openManagerModal()">⚙️ Beheer</button>
    </header>

    <div class="grid-layout">
        <!-- FORMULIER -->
        <div class="card">
            <h2>Verkoop Invoeren</h2>
            
            <div class="form-group">
                <label>Verkoper</label>
                <select id="sellerSelect"></select>
            </div>

            <div class="form-group">
                <label>Categorie</label>
                <select id="categorySelect" onchange="onCategoryChange()">
                    <option value="mobile">Mobiel / Postpaid</option>
                    <option value="internet">Internet</option>
                    <option value="loose_value">Losse Value / Streaming / Opties</option>
                    <option value="hardware">Hardware (GSM & ACC)</option>
                </select>
            </div>

            <div class="form-group" id="productGroup">
                <label id="productLabel">Nieuw Product</label>
                <select id="productSelect"></select>
            </div>

            <div class="checkbox-group hidden" id="migrationGroup">
                <input type="checkbox" id="isMigration" onchange="toggleMigrationInput()">
                <label for="isMigration" style="margin:0;">Dit is een Migratie / Upgrade (geen nieuw abonnement)</label>
            </div>

            <div class="form-group hidden" id="oldProductGroup">
                <label>Oud Product (waar de klant vandaan komt)</label>
                <select id="oldProductSelect"></select>
            </div>

            <div class="form-group hidden" id="hardwareGroup">
                <label>Aantal GSM's</label>
                <input type="number" id="gsmCount" value="0" min="0">
                <label style="margin-top:8px;">Aantal Accessoires (ACC)</label>
                <input type="number" id="accCount" value="0" min="0">
            </div>

            <button class="btn btn-primary" type="button" onclick="submitSale()">Verkoop Opslaan 🚀</button>
        </div>

        <!-- DASHBOARD -->
        <div>
            <div class="card">
                <h2>Dagstand Winkel</h2>
                <div class="kpi-grid">
                    <div class="kpi-box" id="kpi-box-internet">
                        <div class="kpi-title">Internet</div>
                        <div class="kpi-value" id="total-internet">0</div>
                        <div class="kpi-target">Target: <span id="target-internet">0</span></div>
                    </div>
                    <div class="kpi-box" id="kpi-box-mobile">
                        <div class="kpi-title">Mobiel</div>
                        <div class="kpi-value" id="total-mobile">0</div>
                        <div class="kpi-target">Target: <span id="target-mobile">0</span></div>
                    </div>
                    <div class="kpi-box" id="kpi-box-value">
                        <div class="kpi-title">Value</div>
                        <div class="kpi-value" id="total-value">€ 0.00</div>
                        <div class="kpi-target">Target: <span id="target-value">€ 0.00</span></div>
                    </div>
                    <div class="kpi-box" id="kpi-box-gsm">
                        <div class="kpi-title">GSM</div>
                        <div class="kpi-value" id="total-gsm">0</div>
                        <div class="kpi-target">Target: <span id="target-gsm">0</span></div>
                    </div>
                    <div class="kpi-box" id="kpi-box-acc">
                        <div class="kpi-title">ACC</div>
                        <div class="kpi-value" id="total-acc">0</div>
                        <div class="kpi-target">Target: <span id="target-acc">0</span></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Prestaties per Verkoper</h2>
                <div style="overflow-x: auto;">
                    <table class="team-table">
                        <thead>
                            <tr>
                                <th>Naam</th>
                                <th>INT</th>
                                <th>MOB</th>
                                <th>Value</th>
                                <th>GSM</th>
                                <th>ACC</th>
                            </tr>
                        </thead>
                        <tbody id="teamTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MANAGER MODAL -->
    <div id="managerModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="margin-bottom:12px; color:var(--accent-blue);">⚙️ Manager Beheermenu</h2>
            
            <div id="pinSection">
                <div class="form-group">
                    <label>Manager PIN</label>
                    <input type="password" id="managerPinInput" maxlength="4" placeholder="****">
                </div>
                <button class="btn btn-primary" type="button" onclick="verifyPin()">Inloggen</button>
            </div>

            <div id="managerControls" class="hidden">
                <button class="btn btn-danger" type="button" style="width:100%; margin-bottom:16px;" onclick="resetDailyStats()">🔄 Dagstand Resetten naar 0</button>
                
                <h3 style="font-size:0.9rem; margin-bottom:8px;">Teamlid Toevoegen</h3>
                <div class="form-group">
                    <input type="text" id="newNameInput" placeholder="Naam collega">
                </div>
                <div class="form-group">
                    <label>Regime</label>
                    <select id="newRegimeInput">
                        <option value="100">100% Fulltime</option>
                        <option value="80">80% Parttime</option>
                    </select>
                </div>
                <button class="btn" type="button" style="width:100%; background:#059669; margin-bottom:16px;" onclick="addTeamMember()">+ Toevoegen</button>

                <h3 style="font-size:0.9rem; margin-bottom:8px;">Team Beheren</h3>
                <div id="teamMemberList" style="margin-bottom:16px;"></div>

                <button class="btn" type="button" style="width:100%; background:#475569;" onclick="closeManagerModal()">Sluiten</button>
            </div>
        </div>
    </div>

    <script>
        const MANAGER_PIN = "1234";
        const WORK_DAYS_IN_MONTH = 22;

        const PRODUCTS = {
            mobile: [
                { name: "BASE 10", value: 8.26 },
                { name: "BASE Pro Start / PRO Start", value: 8.26 },
                { name: "BASE Pro 11", value: 9.09 },
                { name: "BASE 15", value: 12.40 },
                { name: "King", value: 12.40 },
                { name: "BASE 20", value: 16.53 },
                { name: "BASE 25", value: 20.66 },
                { name: "Kong", value: 20.14 },
                { name: "BASE 29", value: 23.97 },
                { name: "BASE 30", value: 24.79 },
                { name: "BASE 35", value: 28.93 },
                { name: "BASE 39", value: 32.23 },
                { name: "BASE 45", value: 37.19 },
                { name: "BASE 59", value: 48.76 }
            ],
            internet: [
                { name: "Easy Internet", value: 25.21 },
                { name: "Basic Internet", value: 32.22 },
                { name: "BASE Internet Unlimited", value: 33.06 },
                { name: "Internet Fiber Basic", value: 39.22 },
                { name: "Internet Fiber Standard", value: 60.70 },
                { name: "Internet Fiber Turbo", value: 79.38 },
                { name: "Internet Fiber Standard Pro", value: 84.98 },
                { name: "Internet Fiber Turbo Pro", value: 111.13 }
            ],
            loose_value: [
                { name: "Vaste Lijn / Telefonie", value: 1.65 },
                { name: "Streamz Basic", value: 3.71 },
                { name: "BASE TV Box", value: 4.13 },
                { name: "Disney+", value: 6.61 },
                { name: "Netflix Standard", value: 7.02 },
                { name: "Netflix Premium", value: 9.09 },
                { name: "Play Sports", value: 10.33 }
            ]
        };

        const MONTHLY_TARGETS = {
            100: { internet: 15, mobile: 33, value: 1932, gsm: 12, acc: 7 },
            80:  { internet: 12, mobile: 26, value: 1546, gsm: 10, acc: 6 }
        };

        let team = [
            { id: 1, name: "Tom", regime: 100 },
            { id: 2, name: "Mohit", regime: 100 },
            { id: 3, name: "Sebastian", regime: 100 },
            { id: 4, name: "Cosmin", regime: 100 },
            { id: 5, name: "Saskia", regime: 100 },
            { id: 6, name: "Louise", regime: 100 },
            { id: 7, name: "Amel", regime: 80 },
            { id: 8, name: "Dominique", regime: 100 },
            { id: 9, name: "Redje", regime: 100 },
            { id: 10, name: "Najib", regime: 80 },
            { id: 11, name: "Robbe", regime: 100 },
            { id: 12, name: "Erkhem", regime: 100 }
        ];

        let salesData = {};

        function loadSavedData() {
            try {
                const savedSales = localStorage.getItem("dbmeir_sales_v3");
                if (savedSales) salesData = JSON.parse(savedSales);
            } catch (e) { console.error(e); }
            team.forEach(m => {
                if (!salesData[m.name]) {
                    salesData[m.name] = { internet: 0, mobile: 0, value: 0, gsm: 0, acc: 0 };
                }
            });
        }

        function saveData() {
            try {
                localStorage.setItem("dbmeir_sales_v3", JSON.stringify(salesData));
            } catch (e) { console.error(e); }
        }

        function initData() {
            loadSavedData();
            populateSellerDropdown();
            onCategoryChange();
            updateDashboard();
        }

        function populateSellerDropdown() {
            const select = document.getElementById("sellerSelect");
            select.innerHTML = "";
            team.forEach(m => {
                let opt = document.createElement("option");
                opt.value = m.name;
                opt.innerText = `${m.name} (${m.regime}%)`;
                select.appendChild(opt);
            });
        }

        function onCategoryChange() {
            const cat = document.getElementById("categorySelect").value;
            const pGroup = document.getElementById("productGroup");
            const pSelect = document.getElementById("productSelect");
            const mGroup = document.getElementById("migrationGroup");
            const hGroup = document.getElementById("hardwareGroup");

            pGroup.classList.add("hidden");
            mGroup.classList.add("hidden");
            document.getElementById("oldProductGroup").classList.add("hidden");
            hGroup.classList.add("hidden");

            if (cat === "mobile" || cat === "internet" || cat === "loose_value") {
                pGroup.classList.remove("hidden");
                pSelect.innerHTML = "";
                PRODUCTS[cat].forEach((p) => {
                    let opt = document.createElement("option");
                    opt.value = p.value; // Direct de prijs als getal
                    opt.innerText = `${p.name} (€ ${p.value.toFixed(2)})`;
                    pSelect.appendChild(opt);
                });
                
                if (cat === "mobile" || cat === "internet") {
                    mGroup.classList.remove("hidden");
                    populateOldProductDropdown(cat);
                }
            } else if (cat === "hardware") {
                hGroup.classList.remove("hidden");
            }
        }

        function populateOldProductDropdown(category) {
            const oldSelect = document.getElementById("oldProductSelect");
            oldSelect.innerHTML = "";
            PRODUCTS[category].forEach((p) => {
                let opt = document.createElement("option");
                opt.value = p.value; // Direct de prijs als getal
                opt.innerText = `${p.name} (€ ${p.value.toFixed(2)})`;
                oldSelect.appendChild(opt);
            });
        }

        function toggleMigrationInput() {
            const isMig = document.getElementById("isMigration").checked;
            const oGroup = document.getElementById("oldProductGroup");
            if (isMig) oGroup.classList.remove("hidden");
            else oGroup.classList.add("hidden");
        }

        function submitSale() {
            const seller = document.getElementById("sellerSelect").value;
            const cat = document.getElementById("categorySelect").value;
            if (!seller) return alert("Selecteer een verkoper!");

            if (!salesData[seller]) {
                salesData[seller] = { internet: 0, mobile: 0, value: 0, gsm: 0, acc: 0 };
            }

            if (cat === "mobile" || cat === "internet") {
                const newPrice = parseFloat(document.getElementById("productSelect").value) || 0;
                const isMig = document.getElementById("isMigration").checked;

                if (isMig) {
                    const oldPrice = parseFloat(document.getElementById("oldProductSelect").value) || 0;
                    
                    // SIMPLICITEIT: Alleen de simpele som (Nieuw - Oud)
                    const diff = newPrice - oldPrice;
                    const addedValue = diff > 0 ? diff : 0; // Als het negatief is, telt hij 0 op

                    salesData[seller].value += addedValue;
                    alert(`Upgrade berekend voor ${seller}!\nNieuw (€${newPrice.toFixed(2)}) - Oud (€${oldPrice.toFixed(2)}) = +€${addedValue.toFixed(2)} toegevoegd aan Value.`);
                } else {
                    if (cat === "mobile") salesData[seller].mobile += 1;
                    else salesData[seller].internet += 1;

                    salesData[seller].value += newPrice;
                    alert(`Nieuwe aansluiting opgeslagen voor ${seller}!`);
                }
            } else if (cat === "loose_value") {
                const price = parseFloat(document.getElementById("productSelect").value) || 0;
                salesData[seller].value += price;
                alert(`Losse Value opgeslagen voor ${seller}!`);
            } else if (cat === "hardware") {
                const gsm = parseInt(document.getElementById("gsmCount").value, 10) || 0;
                const acc = parseInt(document.getElementById("accCount").value, 10) || 0;
                salesData[seller].gsm += gsm;
                salesData[seller].acc += acc;
                alert(`Hardware opgeslagen voor ${seller}!`);
            }

            saveData();
            updateDashboard();

            document.getElementById("isMigration").checked = false;
            toggleMigrationInput();
            document.getElementById("gsmCount").value = 0;
            document.getElementById("accCount").value = 0;
        }

        function updateDashboard() {
            let totalInt = 0, totalMob = 0, totalVal = 0, totalGsm = 0, totalAcc = 0;
            let targetInt = 0, targetMob = 0, targetVal = 0, targetGsm = 0, targetAcc = 0;

            const tbody = document.getElementById("teamTableBody");
            tbody.innerHTML = "";

            team.forEach(m => {
                const data = salesData[m.name] || { internet: 0, mobile: 0, value: 0, gsm: 0, acc: 0 };
                
                const curInt = Number(data.internet) || 0;
                const curMob = Number(data.mobile) || 0;
                const curVal = Number(data.value) || 0;
                const curGsm = Number(data.gsm) || 0;
                const curAcc = Number(data.acc) || 0;

                totalInt += curInt;
                totalMob += curMob;
                totalVal += curVal;
                totalGsm += curGsm;
                totalAcc += curAcc;

                const t = MONTHLY_TARGETS[m.regime];
                targetInt += t.internet / WORK_DAYS_IN_MONTH;
                targetMob += t.mobile / WORK_DAYS_IN_MONTH;
                targetVal += t.value / WORK_DAYS_IN_MONTH;
                targetGsm += t.gsm / WORK_DAYS_IN_MONTH;
                targetAcc += t.acc / WORK_DAYS_IN_MONTH;

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${m.name} <span class="badge-regime">${m.regime}%</span></td>
                    <td>${curInt}</td>
                    <td>${curMob}</td>
                    <td>€ ${curVal.toFixed(2)}</td>
                    <td>${curGsm}</td>
                    <td>${curAcc}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("total-internet").innerText = totalInt;
            document.getElementById("target-internet").innerText = Math.round(targetInt);
            updateKpiColor("kpi-box-internet", totalInt, targetInt);

            document.getElementById("total-mobile").innerText = totalMob;
            document.getElementById("target-mobile").innerText = Math.round(targetMob);
            updateKpiColor("kpi-box-mobile", totalMob, targetMob);

            document.getElementById("total-value").innerText = `€ ${totalVal.toFixed(2)}`;
            document.getElementById("target-value").innerText = `€ ${Math.round(targetVal)}`;
            updateKpiColor("kpi-box-value", totalVal, targetVal);

            document.getElementById("total-gsm").innerText = totalGsm;
            document.getElementById("target-gsm").innerText = Math.round(targetGsm);
            updateKpiColor("kpi-box-gsm", totalGsm, targetGsm);

            document.getElementById("total-acc").innerText = totalAcc;
            document.getElementById("target-acc").innerText = Math.round(targetAcc);
            updateKpiColor("kpi-box-acc", totalAcc, targetAcc);
        }

        function updateKpiColor(boxId, current, target) {
            const box = document.getElementById(boxId);
            box.classList.remove("status-red", "status-yellow", "status-green");
            const pct = target > 0 ? (current / target) : 1;
            if (pct >= 1.0) box.classList.add("status-green");
            else if (pct >= 0.5) box.classList.add("status-yellow");
            else box.classList.add("status-red");
        }

        function openManagerModal() {
            document.getElementById("managerModal").classList.remove("hidden");
            document.getElementById("pinSection").classList.remove("hidden");
            document.getElementById("managerControls").classList.add("hidden");
            document.getElementById("managerPinInput").value = "";
        }

        function closeManagerModal() {
            document.getElementById("managerModal").classList.add("hidden");
        }

        function verifyPin() {
            if (document.getElementById("managerPinInput").value === MANAGER_PIN) {
                document.getElementById("pinSection").classList.add("hidden");
                document.getElementById("managerControls").classList.remove("hidden");
                renderTeamManagerList();
            } else { alert("Onjuiste PIN!"); }
        }

        function resetDailyStats() {
            if (confirm("Weet je zeker dat je de dagstand wilt resetten naar 0?")) {
                team.forEach(m => salesData[m.name] = { internet: 0, mobile: 0, value: 0, gsm: 0, acc: 0 });
                saveData();
                updateDashboard();
                alert("Dagstand gereset naar 0!");
            }
        }

        function addTeamMember() {
            const name = document.getElementById("newNameInput").value.trim();
            const regime = Number(document.getElementById("newRegimeInput").value);
            if (!name) return alert("Vul een naam in!");

            team.push({ id: Date.now(), name, regime });
            salesData[name] = { internet: 0, mobile: 0, value: 0, gsm: 0, acc: 0 };
            saveData();
            document.getElementById("newNameInput").value = "";
            populateSellerDropdown();
            renderTeamManagerList();
            updateDashboard();
        }

        function removeTeamMember(id) {
            if (confirm("Teamlid verwijderen?")) {
                team = team.filter(m => m.id !== id);
                populateSellerDropdown();
                renderTeamManagerList();
                updateDashboard();
            }
        }

        function renderTeamManagerList() {
            const container = document.getElementById("teamMemberList");
            container.innerHTML = "";
            team.forEach(m => {
                let div = document.createElement("div");
                div.style.display = "flex";
                div.style.justifyContent = "space-between";
                div.style.alignItems = "center";
                div.style.marginBottom = "6px";
                div.style.background = "#0f172a";
                div.style.padding = "8px";
                div.style.borderRadius = "6px";
                div.innerHTML = `
                    <span>${m.name} (${m.regime}%)</span>
                    <button class="btn btn-danger" type="button" style="padding:4px 8px; font-size:0.75rem;" onclick="removeTeamMember(${m.id})">Verwijderen</button>
                `;
                container.appendChild(div);
            });
        }

        window.onload = initData;
    </script>
</body>
</html>
